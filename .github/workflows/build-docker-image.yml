name: Build Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "anonymization_core.py"
      - "beyond_recognizers.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/build-docker-image.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: engageme1975
          password: ${{ secrets.CR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/engageme1975/engage-me-data-anonymiser:latest
            ghcr.io/engageme1975/engage-me-data-anonymiser:${{ github.sha }}

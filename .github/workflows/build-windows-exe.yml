name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "anonymization_core.py"
      - "desktop_app.py"
      - "beyond_recognizers.py"
      - "requirements.txt"
      - "build-windows-exe.ps1"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m spacy download en_core_web_md

      - name: Build executable
        shell: pwsh
        run: |
          ./build-windows-exe.ps1

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Engage-Me-Data-Anonymiser/*" -DestinationPath "Engage-Me-Data-Anonymiser-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Engage-Me-Data-Anonymiser-windows
          path: Engage-Me-Data-Anonymiser-windows.zip

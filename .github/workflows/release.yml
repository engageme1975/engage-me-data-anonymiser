name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-windows-exe:
    needs: resolve-tag
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m spacy download en_core_web_md

      - name: Build executable
        shell: pwsh
        run: |
          ./build-windows-exe.ps1

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Engage-Me-Data-Anonymiser/*" -DestinationPath "Engage-Me-Data-Anonymiser-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Engage-Me-Data-Anonymiser-windows.zip

  build-docker-image:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/engage-me-data-anonymiser:latest
            ghcr.io/${{ github.repository_owner }}/engage-me-data-anonymiser:${{ needs.resolve-tag.outputs.tag }}

  publish-release:
    needs: [resolve-tag, build-windows-exe, build-docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: true
          files: Engage-Me-Data-Anonymiser-windows.zip
          body: |
            Docker image: `docker pull ghcr.io/${{ github.repository_owner }}/engage-me-data-anonymiser:${{ needs.resolve-tag.outputs.tag }}`
